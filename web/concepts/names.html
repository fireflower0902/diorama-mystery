<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>이름·아이콘 후보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
body { margin: 0; background: #1f1813; color: #f4e8d2; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; padding: 36px; }
h1 { font-family: "Gowun Batang", serif; margin: 0 0 24px; font-size: 26px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.c { background: #2c221b; border-radius: 18px; padding: 22px 16px; text-align: center; border: 1px solid rgba(255,230,190,.1); }
.c svg { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
.c b { display: block; font-family: "Gowun Batang", serif; font-size: 26px; margin: 14px 0 4px; }
.c small { display: block; color: #f2c46b; font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
.c p { margin: 0; font-size: 13px; color: #b3a18a; line-height: 1.55; }
.c.rec { border-color: #f2c46b; }
</style></head><body>
<h1>게임 이름 · 아이콘 후보</h1>
<div class="grid">
  <div class="c rec">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a1f17"/><circle cx="27" cy="27" r="13" fill="none" stroke="#caa77a" stroke-width="2.2" stroke-dasharray="3 3"/><path d="M27 14c8 0 14 5 14 12s-5 10-10 11c-4 1-6 4-6 8v4" fill="none" stroke="#f4ecdc" stroke-width="3.2" stroke-linecap="round"/><circle cx="25" cy="53" r="2.6" fill="#f4ecdc"/><path d="M41 26c6 2 10 8 13 18" fill="none" stroke="#d9653f" stroke-width="2.6" stroke-linecap="round"/></svg>
    <b>실마리</b><small>추천 · 실을 당기면 물음표가 풀린다</small><p>설명 문구 "실마리를 찾아서 사건을 해결한다"와 바로 이어짐. 어떤 테마에도 맞음.</p>
  </div>
  <div class="c">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a1f17"/><ellipse cx="22" cy="40" rx="6" ry="8.5" fill="#caa77a" transform="rotate(-12 22 40)"/><g fill="#caa77a"><circle cx="15" cy="29" r="2.3"/><circle cx="19" cy="26.5" r="2.3"/><circle cx="24" cy="26.5" r="2.3"/><circle cx="28" cy="29" r="2.2"/></g><ellipse cx="38" cy="24" rx="5" ry="7.5" fill="#8a6242" transform="rotate(10 38 24)"/><circle cx="44" cy="42" r="9" fill="#f4ecdc" stroke="#1f1813" stroke-width="3"/><circle cx="44" cy="42" r="5" fill="#27c2a8"/><path d="M50.5 48.5 56 54" stroke="#f4ecdc" stroke-width="4" stroke-linecap="round"/></svg>
    <b>흔적</b><small>발자국 + 돋보기</small><p>짧고 묵직함. "모든 사건엔 흔적이 남는다" 문구와 잘 맞음.</p>
  </div>
  <div class="c">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a1f17"/><path d="M14 44c0-6 6-8 18-8s18 2 18 8v6H14z" fill="#caa77a"/><circle cx="32" cy="27" r="12" fill="#ffe1cc"/><path d="M19 24c2-9 24-9 26 0-6-3-20-3-26 0z" fill="#2a2224"/><path d="M16 23h32l-4-6H20z" fill="#6b4a32"/><circle cx="27.5" cy="29" r="1.8" fill="#2a2020"/><circle cx="36.5" cy="29" r="1.8" fill="#2a2020"/><circle cx="47" cy="44" r="6.5" fill="#f4ecdc" stroke="#1f1813" stroke-width="2.4"/><circle cx="47" cy="44" r="3.4" fill="#27c2a8"/></svg>
    <b>손바닥 탐정</b><small>작은 피규어 탐정</small><p>귀여운 피규어·미니어처 느낌을 살림. 가볍고 친근함.</p>
  </div>
  <div class="c">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a1f17"/><path d="M12 26 32 16l20 10v18L32 54 12 44z" fill="#c9965e"/><path d="M12 26l20 10v18L12 44z" fill="#a8744a"/><path d="M32 36l20-10v18L32 54z" fill="#8a5a36"/><rect x="26" y="25" width="12" height="9" rx="1.5" fill="#f4ecdc" transform="skewY(-26) translate(0 15)"/><text x="32" y="33" font-size="12" font-weight="800" text-anchor="middle" fill="#d9653f" font-family="sans-serif">?</text></svg>
    <b>미니룸 미스터리</b><small>작은 방 + 물음표</small><p>게임 구조(작은 방을 돌아다님)를 그대로 설명. 직관적.</p>
  </div>
  <div class="c">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a1f17"/><rect x="17" y="12" width="30" height="40" rx="2" fill="#f4ecdc"/><path d="M22 20h20M22 25h16M22 30h18" stroke="#b3a18a" stroke-width="2" stroke-linecap="round"/><rect x="22" y="35" width="20" height="4" fill="#1f1813"/><path d="M14 44l18-6 18 6-18 8z" fill="#d9653f" opacity=".9"/></svg>
    <b>마지막 기록</b><small>가려진 기록 문서</small><p>미스터리 소설 같은 분위기. 사건마다 "마지막 기록"이 다르게 등장.</p>
  </div>
</div>
</body></html>
