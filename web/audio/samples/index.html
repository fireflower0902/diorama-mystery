<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>4°C 음성 샘플 (Edge TTS)</title>
  <style>
    body { margin: 0; padding: 40px; background: #0d1014; color: #e7e3da; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    h1 { margin: 0 0 6px; } p.sub { color: #8b94a0; margin: 0 0 26px; }
    .row { background: #151a20; border: 1px solid #262d36; border-radius: 14px; padding: 16px 18px; margin: 12px 0; max-width: 820px; }
    .row b { color: #f0b44c; } .row span { color: #8b94a0; font-size: 13px; margin-left: 8px; }
    .row p { margin: 8px 0 10px; line-height: 1.6; }
    .btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    audio { height: 36px; }
    button { background: #232b35; color: #e7e3da; border: 1px solid #36404c; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: #f0b44c; }
  </style>
</head>
<body>
  <h1>음성 샘플 비교</h1>
  <p class="sub">▶ 재생 = Edge TTS (새 음성) · "지금 음성으로 듣기" = 현재 게임의 맥 기본 합성음</p>
  <div id="list"></div>
  <script>
    const S = [
      ['1_내레이션', '내레이션', 'SunHi · 조금 느리고 낮게', '11월 15일 일요일, 오후 3시 20분. 동생 서윤과 연락이 끊긴 지 15시간이 지났다.', 'Yuna', 0.95, 1.0],
      ['2_서진', '한서진 (나)', 'SunHi', '서윤이 워치는 밤새 연구동 와이파이에 붙어 있었어요. 한강으로 간 건 휴대폰뿐이에요.', 'Flo', 1.05, 1.05],
      ['3_형사_김도경', '김도경 형사', 'InJoon', '워치요? 잠깐만요. 그 시간에 버스 탄 기록이 있는데, 워치는 학교에 있었다고요? 알겠습니다. 바로 자료 보내 드리겠습니다.', 'Reed', 1.0, 0.85],
      ['4_강태오', '강태오', 'Hyunsu · 조금 빠르게', '그날 제가 좀 심하게 말했어요. 근데 진짜, 그런 뜻은 아니었어요.', 'Rocko', 1.08, 1.0],
      ['5_경비원_박영수', '경비원 박영수', 'InJoon · 느리고 낮게', '죄송합니다. 경찰 허가 없이는 영상이나 출입 기록을 보여 드릴 수가 없어요.', 'Grandpa', 0.92, 0.9],
      ['6_서윤_엔딩', '한서윤 (엔딩)', 'SunHi · 높게', '언니, 내 노트북 봤구나.', 'Shelley', 1.05, 1.15],
    ];
    document.getElementById('list').innerHTML = S.map(([f, who, v, t], i) => `<div class="row"><b>${who}</b><span>${v}</span><p>${t}</p>
      <div class="btns"><audio controls src="${encodeURIComponent(f)}.mp3"></audio><button onclick="old(${i})">지금 음성으로 듣기</button></div></div>`).join('');
    function old(i) {
      const [, , , t, name, rate, pitch] = S[i]; speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate; u.pitch = pitch;
      const v = speechSynthesis.getVoices().find(v => v.name.includes(name)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
